<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Void Market</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #09090b; /* zinc-950 */
        color: #fafafa;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      /* PixiJS canvas fills the background */
      #pixi-canvas {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      /* React DOM overlay sits on top */
      #react-root {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      #react-root > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="pixi-canvas"></div>
      <div id="react-root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
